<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영화 정보 JSON 만들기</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="mb-4">
            <span class="badge text-bg-primary mb-2">실습 01</span>
            <h1 class="fw-bold">영화 정보 JSON 만들기</h1>
            <p class="text-secondary mb-0">
              Form에 입력한 값을 JavaScript 객체로 만들고 JSON 문자열로
              변환해보세요.
            </p>
          </div>

          <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
              <form id="movie-form">
                <div class="mb-3">
                  <label for="title" class="form-label fw-semibold">
                    영화 제목
                  </label>

                  <input
                    id="title"
                    type="text"
                    class="form-control"
                    value="Inception"
                  />
                </div>

                <div class="mb-3">
                  <label for="rating" class="form-label fw-semibold">
                    평점
                  </label>

                  <input
                    id="rating"
                    type="number"
                    class="form-control"
                    step="0.1"
                    min="0"
                    max="10"
                    value="8.4"
                  />
                </div>

                <div class="mb-4">
                  <label for="language" class="form-label fw-semibold">
                    언어
                  </label>

                  <select id="language" class="form-select">
                    <option value="en">English</option>
                    <option value="ko">한국어</option>
                    <option value="ja">日本語</option>
                  </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  JSON 만들기
                </button>
              </form>
            </div>
          </div>

          <div class="card border-0 shadow-sm">
            <div class="card-header bg-dark text-white">JSON 결과</div>

            <div class="card-body">
              <pre id="json-output" class="bg-light border rounded p-3 mb-0">
JSON 변환 결과가 여기에 표시됩니다.</pre
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
